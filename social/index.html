<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hailaran</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Hailaran" />
  <meta property="og:description" content="Descubre Hailaran" />
  <meta property="og:url" content="https://hailaran.es/social" />
  <meta property="og:type" content="website" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    p {
      font-size: 1rem;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    p a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      if (/iPhone/i.test(userAgent)) {
        window.location.href = "x-safari-https://www.hailaran.es";
      } else {
        window.location.href = "https://www.hailaran.es";
      }
    });
  </script>
</head>
<body>
  <h1>Hailaran</h1>
  <p>
    Si no eres redireccionado,
    <a href="x-safari-https://www.hailaran.es">clica aquí para iPhone</a>
    o <a href="https://www.hailaran.es">aquí para Android</a>.
  </p>
</body>
</html>
