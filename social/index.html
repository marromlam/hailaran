<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hailaran</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Hailaran" />
  <meta property="og:description" content="Descubre Hailaran" />
  <meta property="og:url" content="https://hailaran.es/social" />
  <meta property="og:type" content="website" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    a.btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: #ffffff;
      color: #0d0d0d;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      transition: opacity 0.15s;
    }

    a.btn:hover { opacity: 0.85; }

    p {
      font-size: 0.85rem;
      color: #666;
      max-width: 28ch;
      line-height: 1.5;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var btn = document.getElementById("openBtn");
      var dest;

      if (/iPhone|iPad|iPod/i.test(ua)) {
        dest = "x-safari-https://www.hailaran.es";
      } else if (/Android/i.test(ua)) {
        dest = "intent://www.hailaran.es/#Intent;scheme=https;" +
               "package=com.android.chrome;" +
               "S.browser_fallback_url=https%3A%2F%2Fwww.hailaran.es;end";
      } else {
        dest = "https://www.hailaran.es";
      }

      // Point the button at the right destination before the user taps it
      btn.href = dest;

      // Also attempt an automatic redirect (blocked by some Instagram versions)
      window.location.href = dest;
    });
  </script>
</head>
<body>
  <h1>Hailaran</h1>
  <!-- href is overwritten by JS; this is the safe fallback -->
  <a id="openBtn" href="https://www.hailaran.es" class="btn">Abrir Hailaran ↗</a>
  <p>Toca el botón si no eres redireccionado automáticamente.</p>
</body>
</html>
