<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hailaran</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Hailaran" />
  <meta property="og:description" content="Descubre Hailaran" />
  <meta property="og:url" content="https://hailaran.es/social" />
  <meta property="og:type" content="website" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    #igCard {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
      max-width: 300px;
    }
    #igCard.show { display: flex; }

    .open-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.5rem;
      background: #fff;
      color: #0d0d0d;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
      50%       { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
    }

    .steps {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      text-align: left;
      width: 100%;
    }

    .steps-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.6rem;
    }

    .steps ol {
      padding-left: 1.1rem;
      color: #999;
      font-size: 0.88rem;
      line-height: 1.7;
    }

    .dots {
      display: inline-block;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 0 5px;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>Hailaran</h1>

  <div id="igCard">
    <a id="openBtn" href="x-safari-https://hailaran.es" class="open-btn">Abrir en Safari ↗</a>

    <div class="steps">
      <div class="steps-label">Si el botón no funciona</div>
      <ol>
        <li>Toca <span class="dots">···</span> abajo a la derecha</li>
        <li>Selecciona <strong style="color:#ddd">"Abrir en navegador externo"</strong></li>
      </ol>
    </div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS       = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid   = /Android/i.test(ua);
      var isInstagram = ua.indexOf("Instagram") > -1 ||
                        ua.indexOf("FBAN") > -1 ||
                        ua.indexOf("FBAV") > -1;

      if (isIOS && isInstagram) {
        document.getElementById("igCard").classList.add("show");

        setTimeout(function () {
          var dl = document.createElement("a");
          dl.href = "data:application/octet-stream,";
          dl.download = "abrir_en_safari.txt";
          document.body.appendChild(dl);
          dl.click();
          document.body.removeChild(dl);
        }, 300);

      } else if (isAndroid && isInstagram) {
        window.location.href =
          "intent://hailaran.es/#Intent;scheme=https;" +
          "package=com.android.chrome;" +
          "S.browser_fallback_url=https%3A%2F%2Fhailaran.es;end";
      } else {
        window.location.href = "https://hailaran.es";
      }
    })();
  </script>
</body>
</html>
